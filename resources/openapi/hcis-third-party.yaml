              example: MITRA-VIS-9812

    PermitTamuReplay:
      type: object
      required: [sukses, message, result]
      properties:
        sukses:
          type: boolean
          example: true
        message:
          type: string
          example: Pengajuan permit sudah pernah diterima
        result:
          type: object
          required: [no_transaksi, status, idempotent_replay]
          properties:
            no_transaksi:
              type: string
              example: PMT0926-0042
            status:
              type: string
              enum: [PENDING, APPROVED, REJECTED, REVOKED, EXPIRED]
            idempotent_replay:
              type: boolean
              enum: [true]

    TanggalTidakOperasional:
      type: object
      required: [tanggal, jenis, nama]
      properties:
        tanggal:
          type: string
          format: date
          description: Tanggal libur / tidak beroperasi dalam format YYYY-MM-DD.
          example: '2026-04-01'
        jenis:
          type: string
          enum: [LIBUR_NASIONAL, CUTI_BERSAMA, LIBUR_PERUSAHAAN]
          description: Kategori jenis hari libur resmi.
          example: CUTI_BERSAMA
        nama:
          type: string
          description: Nama resmi hari libur nasional atau cuti bersama.
          example: Cuti Bersama Idul Fitri 1447 H
        status:
          type: string
          enum: [TERJADWAL, BERJALAN, SELESAI]
          nullable: true
          description: >
            Hanya ada pada jenis `CUTI_BERSAMA`. Menjelaskan status keterlaksanaan hari libur terhadap tanggal saat ini.
          example: TERJADWAL

    KalenderDasar:
      type: object
      required: [unit, hari_kerja_mingguan, digenerate_at, tanggal_tidak_operasional]
      properties:
        unit:
          type: string
          description: Kode unit operasional.
          example: HEAD_OFFICE
        hari_kerja_mingguan:
          type: array
          description: Daftar hari kerja mingguan (1 = Senin s/d 6 = Sabtu, 0 = Minggu).
          items:
            type: integer
            minimum: 0
            maximum: 6
          example: [1, 2, 3, 4, 5, 6]
        digenerate_at:
          type: string
          format: date-time
          description: Timestamp pembentukan data kalender operasional oleh server HCIS.
          example: '2026-09-12T07:30:00+07:00'
        tanggal_tidak_operasional:
          type: array
          description: Daftar tanggal tidak operasional yang diurutkan secara kronologis menaik.
          items:
            $ref: '#/components/schemas/TanggalTidakOperasional'

    KalenderTahun:
      type: object
      required: [sukses, message, result]
      properties:
        sukses:
          type: boolean
          const: true
          example: true
        message:
          type: string
          example: Kalender operasional 2026
        result:
          allOf:
            - $ref: '#/components/schemas/KalenderDasar'
            - type: object
              required: [tahun]
              properties:
                tahun:
                  type: integer
                  description: Tahun kalender yang diminta.
                  example: 2026

    KalenderRentang:
      type: object
      required: [sukses, message, result]
      properties:
        sukses:
          type: boolean
          const: true
          example: true
        message:
          type: string
          example: Kalender operasional 2026-09-01 s/d 2026-12-31
        result:
          allOf:
            - $ref: '#/components/schemas/KalenderDasar'
            - type: object
              required: [dari, sampai]
              properties:
                dari:
                  type: string
                  format: date
                  description: Tanggal awal rentang kalender (YYYY-MM-DD).
                  example: '2026-09-01'
                sampai:
                  type: string
                  format: date
                  description: Tanggal akhir rentang kalender (YYYY-MM-DD).
                  example: '2026-12-31'

    SopKuisCallback:
      type: object
      required:
        - Kode_Karyawan
        - Id_Penjadwalan_Integrasi
        - Id_Ujian_Token
        - Score
      properties:
        Kode_Karyawan:
          type: string
          description: Kode karyawan peserta kuis SOP di HCIS.
          example: KRY-08912
        Id_Penjadwalan_Integrasi:
          type: integer
          description: ID sesi integrasi penjadwalan kuis.
          example: 4412
        Id_Ujian_Token:
          type: string
          description: Token sesi ujian kuis dari platform HC Learn.
          example: 'tok_exam_89a7f32bc01e'
        Score:
          type: number
          minimum: 0
          maximum: 100
          description: Nilai angka hasil kuis (rentang 0 s/d 100).
          example: 87.5

    SopCallbackResponse:
      type: object
      required: [success, message, status]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Data ujian SOP berhasil diproses
        status:
          type: string
          enum: [LULUS, TIDAK_LULUS]
          description: Status kelulusan karyawan berdasarkan ambang batas kelulusan SOP.
          example: LULUS

    Galat:
      type: object
      required: [sukses, message, result]
      properties:
        sukses:
          type: boolean
          const: false
          example: false
        message:
          type: string
          description: Pesan penjelasan penyebab galat.
          example: Terjadi kesalahan validasi data.
        result:
          type: 'null'
          example: null

    PaPenilaianCallback:
      type: object
      required: [Kode_Karyawan, Id_Integrasi, Id_Ujian_Token, Detail]
      properties:
        Kode_Karyawan:
          type: string
          description: |
            PENILAI yang mengisi formulir — bukan orang yang dinilai. Identitas
            yang dinilai tidak diperlukan: tokennya sudah mewakili satu penugasan.
          example: DEMO-001
        Id_Integrasi:
          type: integer
          description: |
            Dikembalikan apa adanya dari penjadwalan. Namanya sengaja sama dengan
            yang HCIS kirim, supaya tidak ada penggantian nama di tengah jalan.
            `Id_Penjadwalan_Integrasi` juga diterima demi klien callback yang sudah
            ada — jangan kirim keduanya dengan nilai berbeda.
          example: 9001
        Id_Penjadwalan_Integrasi:
          type: integer
          description: Alias lama dari `Id_Integrasi`. Pakai salah satu, bukan keduanya.
        Id_Ujian_Token:
          type: string
          description: Satu-satunya kunci sambung ke penugasan.
          example: tok-aaa
        Id_Ujian_Nilai_Akhir:
          type: string
          description: |
            Penanda hasil milik HC Learn. Tidak wajib, tetapi sangat diharapkan:
            dengan ini kiriman ulang bisa dikenali sebagai hasil yang sama. Satu
            penanda tidak boleh mewakili dua isi berbeda — bila itu terjadi,
            kiriman kedua ditolak 422.
          example: NILAI-2027-000123
        Api_Version:
          type: string
          description: Versi bentuk kiriman Anda. Disimpan apa adanya untuk penelusuran.
          example: pa-v1
        Total_Nilai:
          type: number
          description: |
            PEMBANDING SAJA, tidak pernah menjadi sumber nilai. Berguna untuk
            mendeteksi selisih antara hitungan Anda dan hitungan HCIS.
          example: 82.5
        Detail:
          type: array
          minItems: 1
          description: |
            Wajib dan tidak boleh kosong. Kirim SELURUH butir paket dalam satu
            kiriman — bukan sebagian, dan bukan dicicil beberapa kali.
          items: { $ref: '#/components/schemas/PaButirPenilaian' }

    PaButirPenilaian:
      type: object
      required: [Kode_Soal]
      properties:
        Kode_Soal:
          type: string
          description: |
            Harus PERSIS SAMA dengan kode butir pada susunan paket soal — itulah
            satu-satunya jembatan butir ke kompetensi. Butir yang kodenya tidak
            dikenali TIDAK dibuang: ia tersimpan tanpa kompetensi dan dilaporkan
            balik lewat `tak_terpetakan`, karena membuangnya diam-diam membuat
            nilai terhitung dari sebagian butir saja dan angkanya tetap tampak
            wajar. Tidak boleh muncul dua kali dalam satu kiriman.
          example: PA-STAFF-2027-Q01
        Jenis_Soal:
          type: string
          description: Misalnya SKALA atau ESAI. Disimpan untuk penelusuran.
          example: SKALA
        Skor:
          type: number
          nullable: true
          description: |
            Skor mentah butir itu menurut skala Anda — JANGAN dinormalkan ke 100;
            HCIS yang menormalkannya. Boleh kosong untuk butir yang memang tidak
            berskor, misalnya esai.
          example: 4
        Skor_Maksimal:
          type: number
          nullable: true
          description: |
            WAJIB ADA DAN HARUS > 0 setiap kali `Skor` terisi, dan `Skor` tidak
            boleh melebihinya. Tanpa pasangannya sebuah skor tidak punya skala:
            angka 4 bisa berarti sangat baik pada skala 5 atau nyaris gagal pada
            skala 10, dan tidak ada cara menebaknya.
          example: 5
        Bobot_Penilaian:
          type: number
          nullable: true
          description: Bobot butir menurut Anda, bila ada. Disimpan sebagai pembanding.
        Jawaban_Teks:
          type: string
          nullable: true
          description: |
            Jawaban esai atau komentar penilai. Ditampilkan kepada atasan dan HC
            saat verifikasi — inilah yang membuat angka bisa dijelaskan.

    PaPenilaianCallbackHasil:
      type: object
      properties:
        success: { type: boolean, example: true }
        status: { type: integer, example: 200 }
        message: { type: string, example: Hasil penilaian diterima dan dipetakan. }
        result:
          type: object
          properties:
            payload_id: { type: integer, example: 5521 }
            assignment_id: { type: integer, example: 9001 }
            baru:
              type: boolean
              description: '`false` bila kiriman dengan isi yang persis sama sudah pernah diterima.'
              example: true
            perhitungan_diantrekan:
              type: boolean
              description: Apakah kiriman ini melengkapi penugasan dan memicu perhitungan.
              example: false
            butir:
              type: integer
              description: Berapa butir tersimpan dari kiriman ini. Absen pada kiriman ulang.
              example: 3
            berskor:
              type: integer
              description: Berapa di antaranya berskor. Absen pada kiriman ulang.
              example: 2
            tak_terpetakan:
              type: array
              items: { type: string }
              description: |
                `Kode_Soal` yang tidak ada di paket HCIS. Isi yang tidak kosong
                berarti kode butir Anda dan HCIS berbeda. Absen pada kiriman ulang.
            butir_hilang:
              type: array
              items: { type: string }
              description: |
                Butir paket yang tidak Anda kirim. Isi yang tidak kosong berarti
                kiriman belum utuh. Absen pada kiriman ulang.
            kontrak_lengkap:
              type: boolean
              description: |
                `true` hanya bila seluruh butir paket hadir. HANYA nilai `true`
                yang membuat penugasan ditandai selesai dan nilai peserta mulai
                dihitung. Absen pada kiriman ulang.
              example: true

  responses:

    Galat400:
      description: |
        Permintaan tidak sah (*Bad Request*). Format parameter salah atau melanggar batasan sistem:

        | Penyebab Galat | Contoh Pesan `message` |
        |---|---|
        | Parameter `dari` kosong | `Parameter 'dari' wajib diisi (format YYYY-MM-DD).` |
        | Parameter `sampai` kosong | `Parameter 'sampai' wajib diisi (format YYYY-MM-DD).` |
        | Format tanggal salah | `Parameter '{nama}' harus berformat YYYY-MM-DD.` |
        | Tanggal sampai < dari | `Parameter 'sampai' tidak boleh lebih awal dari 'dari'.` |
        | Rentang > 400 hari | `Rentang tanggal maksimal 400 hari.` |
        | Unit tidak dikenal | `Unit '{nilai}' tidak dikenal.` |
        | Tahun di luar batas (2020-2100) | `Parameter 'tahun' harus 4 digit antara 2020 dan 2100.` |
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Galat'
          example:
            sukses: false
            message: Parameter 'sampai' tidak boleh lebih awal dari 'dari'.
            result: null

    Galat401:
      description: |
        Autentikasi gagal (*Unauthorized*). Terjadi karena header keamanan tidak lengkap, timestamp kedaluwarsa, nonce telah digunakan, kunci publik tidak valid, atau tanda tangan HMAC tidak cocok.

        #### ⚠️ Penyebab Kegagalan 401 Paling Umum:
        1. **Format Timestamp Salah**: `X-HC-Timestamp` dikirim sebagai angka epoch Unix (`1789...`). Harus dalam string ISO-8601 UTC (`2026-09-12T07:30:00.000Z`).
        2. **Perbedaan Path yang Ditandatangani**: String kanonikal baris `PATH` harus menggunakan jalur URL yang **benar-benar dipanggil** (misalnya `/api/v1/hcis/visitor/permit-tamu/PMT0926-0042`), bukan pola template rute `{no_transaksi}`.
        3. **Perbedaan Body Hash**: String body yang di-hash SHA-256 pada header `X-HC-Body-Hash` berbeda byte dari raw payload yang dikirimkan.
        4. **Nonce Duplikat**: Mengirimkan nilai `X-HC-Nonce` yang sudah pernah digunakan sebelumnya.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Galat'
          example:
            sukses: false
            message: Signature mismatch. Pastikan format canonical string dan Api_Secret sesuai.
            result: null

    Galat403:
      description: |
        Akses ditolak (*Forbidden*). Kunci publik aplikasi dikenali, tetapi endpoint ini tidak terdaftar dalam whitelist hak akses aplikasi Anda di registry HCIS.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Galat'
          example:
            sukses: false
            message: Aplikasi Anda tidak memiliki izin untuk mengakses endpoint ini.
            result: null

    Galat404:
      description: |
        Data tidak ditemukan (*Not Found*). Nomor transaksi tidak ada di sistem, atau data tersebut milik aplikasi mitra lain (isolasi penyewa).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Galat'
          example:
            sukses: false
            message: Permit tidak ditemukan.
            result: null

    Galat422:
      description: |
        Data permohonan tidak dapat diproses (*Unprocessable Entity*). Payload gagal melewati validasi aturan bisnis atau field wajib tidak terisi.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Galat'
          example:
            sukses: false
            message: Tanggal berlaku harus berformat YYYY-MM-DD.
            result: null

    Galat429:
      description: |
        Batas kuota terlampaui (*Too Many Requests*). Jumlah permit aktif aplikasi Anda telah mencapai ambang batas maksimal.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Galat'
          example:
            sukses: false
            message: Batas permit aktif aplikasi ini sudah tercapai (50). Jatah kembali setelah permit ditolak, dibatalkan, atau kedaluwarsa.
            result: null

    Galat503:
      description: |
        Layanan tidak tersedia (*Service Unavailable*). Master data atau dependensi modul sedang dalam pemeliharaan.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Galat'
          example:
            sukses: false
            message: Master kategori permit COKLAT tidak tersedia.
            result: null
