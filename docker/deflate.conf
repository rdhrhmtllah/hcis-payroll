# Kompresi respons untuk ASET STATIS.
#
# Citra produksi (php:8.3-apache) hanya mengaktifkan mod_rewrite, sehingga
# seluruh berkas terkirim mentah. Yang paling terasa ada di bundel hasil Vite:
# vendor-*.js 2.496 kB (gzip 718 kB) dan vendor-ui-*.js 834 kB (gzip 258 kB) —
# sekitar 70% lalu lintasnya bisa hilang tanpa mengubah satu baris kode pun.
#
# ── Kenapa HANYA berkas statis ───────────────────────────────────────────────
#
# Sengaja dibatasi lewat FilesMatch pada ekstensi, bukan lewat daftar MIME
# global. Mengompresi respons HTML DINAMIS di atas HTTPS membuka BREACH:
# penyerang yang bisa menitipkan teks ke dalam halaman dapat membaca ukuran
# respons untuk menebak rahasia yang ada di halaman yang sama, mis. token CSRF.
# Aset statis tidak memuat rahasia dan tidak memantulkan masukan siapa pun,
# jadi di sini tak ada yang bisa ditebak.
#
# Kalau nanti HTML dinamis mau ikut dikompresi, itu keputusan tersendiri yang
# perlu dipasangkan dengan penyamaran token per-permintaan — bukan sekadar
# menambah satu baris di sini.
#
# ── Memverifikasi setelah deploy ─────────────────────────────────────────────
#
#   curl -sI -H 'Accept-Encoding: gzip' https://<host>/build/assets/<berkas>.js \
#     | grep -i 'content-encoding'
#
# Harus muncul "content-encoding: gzip". Kalau kosong, modulnya tidak aktif.

<IfModule mod_deflate.c>
    <FilesMatch "\.(?:js|mjs|css|svg|json|map|txt|xml|ics)$">
        SetOutputFilter DEFLATE
    </FilesMatch>

    # Tidak ada blok pengecualian untuk gambar/font/arsip, dan itu disengaja:
    # filter DEFLATE hanya dipasang pada daftar-izin ekstensi di atas, jadi
    # berkas yang sudah terkompresi tak pernah menyentuhnya. Daftar-larangan
    # tambahan hanya akan menambah ketergantungan pada mod_env tanpa menahan
    # apa pun.

    # Proksi perantara harus tahu bahwa isi respons bergantung pada
    # Accept-Encoding, kalau tidak versi terkompresi bisa tersaji ke klien yang
    # tidak bisa membukanya. Digerbangi sendiri: kalau mod_headers tidak aktif,
    # baris ini akan menggagalkan START Apache, bukan sekadar diabaikan.
    <IfModule mod_headers.c>
        Header append Vary Accept-Encoding
    </IfModule>
</IfModule>
